<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Sayangku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(to bottom, #ffe4e1, #ffb6c1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .heart-icon {
            font-size: 50px;
            color: #ff4d6d;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .text-box {
            font-size: 1.2rem;
            color: #4a4a4a;
            line-height: 1.6;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        /* Efek Kursor Mengetik */
        .typing {
            border-right: 3px solid #ff4d6d;
            white-space: pre-wrap;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ff4d6d; }
        }

        .btn-next {
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            transition: all 0.3s ease;
            display: none; /* Muncul setelah teks selesai diketik */
        }

        .btn-next:hover {
            background-color: #ff758f;
            transform: translateY(-2px);
        }

        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-icon">❤️</div>
        <div class="text-box">
            <span id="text" class="typing"></span>
        </div>
        <button id="btn" class="btn-next" onclick="nextPage()">Lanjut ✨</button>
    </div>

    <script>
        // Pesan panjang dipecah menjadi beberapa bagian (slide) agar pas di layar HP
        const pesan = [
            "haaii ganteng...",
            "aku mau bilang sesuatu untuk kamu",
            "semoga apa yang akan aku bilng bisa tersampaikan ke kamuu yah🥰",
            "sebelumnya \nmaafin aku yahh udah egoisss\naku ga jujur dengan diri ra sendiri.",
            "sayangg...\nra dari awal ga pernh mau pisah dari sayangg",
            "tapi ra ingin sekali aja \nra ingin melihat sayang takut akan kehilangan ra 🥺",
            "tapi dari awal ra pun tau \nsayang gaakn berubah pikiran...",
            "tapi ra juga tetep pngen lihat disayang bangett sm sayang",
            "ra pngen dihentiin \nra pngen syang tenangin ra",
            "ra pngen syang bujuk ra lngsung dari tlpn atau vc",
            "krna kalau dri cht \nperasaan syang kurang tersampaikan ke raa, ketika ra dalam keadaan seperti ituu.",
            "jadi syanggg...\nayo baikan 🥺❤️",
            "ra gamau pisah dari sayanggg\nmaafin ra ya syangku \nra salahh 😭🙏"
        ];

        let halamanSekarang = 0;
        let indeksKarakter = 0;
        const elemenTeks = document.getElementById("text");
        const tombol = document.getElementById("btn");
        const kecepatanKetik = 60; // Mengatur kecepatan ketik (milidetik per karakter)

        function ketikTeks() {
            if (indeksKarakter < pesan[halamanSekarang].length) {
                elemenTeks.textContent += pesan[halamanSekarang].charAt(indeksKarakter);
                indeksKarakter++;
                setTimeout(ketikTeks, kecepatanKetik);
            } else {
                // Tampilkan tombol setelah teks selesai diketik
                tombol.style.display = "inline-block";
                if (halamanSekarang === pesan.length - 1) {
                    tombol.textContent = "Selesai ❤️";
                }
            }
        }

        function nextPage() {
            if (halamanSekarang < pesan.length - 1) {
                halamanSekarang++;
                indeksKarakter = 0;
                elemenTeks.textContent = "";
                tombol.style.display = "none";
                ketikTeks();
            } else {
                alert("Makasih ya udah dibaca sampai habis... I love you! 🥰");
            }
        }

        // Mulai animasi ketik pertama kali saat halaman dimuat
        window.onload = ketikTeks;
    </script>
</body>
</html>
